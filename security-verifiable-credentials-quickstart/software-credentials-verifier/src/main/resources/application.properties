#quarkus.oidc.auth-server-url=${keycloak.host}/realms/software-credentials
#quarkus.oidc.tenant-paths=/best-software-company/presentation
## To workaround a mismatch between NGrock and localhost domains and simplify a demo
#quarkus.oidc.token.issuer=any
#quarkus.oidc.tls.verification=NONE

quarkus.tls.keycloak.trust-store.pem.certs=keycloak-certificate.pem
quarkus.tls.keycloak.hostname-verification-algorithm=NONE

quarkus.oidvc.credential-issuer-url=https://localhost:8443/realms/software-credentials
quarkus.oidvc.tls-configuration-name=keycloak

quarkus.oidvp.verifier-host=${verifier.domain:http://localhost:8082}
quarkus.oidvp.request-credential-path=/best-software-company/request-credential
quarkus.oidvp.presentation-path=/best-software-company/presentation
quarkus.oidvp.home-path=/best-software-company
quarkus.oidvp.token.age=1H

wallet.host=${wallet.domain:http://localhost:8080}
issuer.host=${issuer.domain:http://localhost:8081}
keycloak.host=${keycloak.domain:https://localhost:8443}

quarkus.log.category."io.quarkiverse.oidvp".level=DEBUG
