<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store a credential in Wallet</title>
    <style>
        h1, h2, h3, h4, h5, h6 {
            margin-bottom: 0.5rem;
            font-weight: 400;
            line-height: 1.5;
        }

        h1 {
            font-size: 2.5rem;
        }

        h2 {
            font-size: 2rem
        }

        h3 {
            font-size: 1.75rem
        }

        h4 {
            font-size: 1.5rem
        }

        h5 {
            font-size: 1.25rem
        }

        h6 {
            font-size: 1rem
        }

        .lead {
            font-weight: 300;
            font-size: 2rem;
        }

        .banner {
            font-size: 2.7rem;
            margin: 0;
            padding: 2rem 1rem;
            background-color: #00A1E2;
            color: white;
        }

        body {
            margin: 0;
            font-family: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }

        code {
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 87.5%;
            color: #e83e8c;
            word-break: break-word;
        }

        .left-column {
            padding: .75rem;
            max-width: 75%;
            min-width: 55%;
        }

        .right-column {
            padding: .75rem;
            max-width: 25%;
        }

        .container {
            display: flex;
            width: 100%;
        }

        li {
            margin: 0.75rem;
        }

        .right-section {
            margin-left: 1rem;
            padding-left: 0.5rem;
        }

        .right-section h3 {
            padding-top: 0;
            font-weight: 200;
        }

        .right-section ul {
            border-left: 0.3rem solid #00A1E2;
            list-style-type: none;
            padding-left: 0;
        }

        table {
            border-collapse: collapse;
        }
        th,
	td {
	  padding: 5px;
	}
    </style>
</head>
<body>

<div class="banner lead">
	<table>
				   <tr>	
				    <td>
						{#if credential_metadata.displayLogoUri}
							<img src="{credential_metadata.displayLogoUri}"}" width="200" height="200"/>
						{/if}
					</td>
					<td>{#if credential_metadata.displayName}
											     {credential_metadata.displayName}
										        {#else}
											     {credential_metadata.id}{/if} offer
					</td>
				   </tr>	   
			</table>
</div>

<div class="container">
    <div class="left-column">
        <div class="right-section">
            <table>
                {! <tr>
                 <td>
                   <h3>Wallet QR Code:</hr>
                 </td>
                 <td>
                   <img src="data:image/png;base64, {base64WalletQrCode}" alt="Wallet QR Code"/>
                 </td>
                </tr> !}
                <tr>
                 <td>
                   <h3>Web Link QR Code:</hr>
                 </td>
                 <td>
                   <img src="data:image/png;base64, {base64WebLinkQrCode}" alt="Web Link QR Code"/>
                 </td>
                </tr>
                <tr> 
                 <td>
                   <a href="{walletCredentialOffer}">Open in Wallet</a>
                 </td>
                </tr>
              </table> 
			  <table>
			  				<tr>	
			  	            <td>
			  	               <a href="/software-credentials-academy/dashboard">Software Credentials Academy Home</a>
			  	             </td>
			  	            </tr>
			  				                
			  	          </table>
        </div>
    </div>
	
    <div class="right-column">
        
    </div>
</div>
</body>
</html>
