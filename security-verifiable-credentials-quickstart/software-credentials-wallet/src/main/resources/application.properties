quarkus.oidc.authentication.force-redirect-https-scheme=${force.redirect.https.scheme:false}
# To workaround a mismatch between NGrock and localhost domains and simplify a demo
#quarkus.oidc.tls.tls-configuration-name=keycloak
quarkus.oidc.token.issuer=any
quarkus.oidc.tls.verification=NONE

quarkus.oidc-client.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.client-id=${quarkus.oidc.client-id}
quarkus.oidc-client.credentials.secret=${quarkus.oidc.credentials.secret}
quarkus.oidc-client.grant.type=preauthorized-code
