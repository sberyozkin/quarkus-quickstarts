#quarkus.oidc-client.tls.tls-configuration-name=keycloak
quarkus.oidc-client.tls.verification=NONE

quarkus.tls.keycloak.trust-store.pem.certs=keycloak-certificate.pem
quarkus.tls.keycloak.hostname-verification-algorithm=NONE

quarkus.http.auth.permission.authenticated.paths=/software-credentials-wallet/wallet-logout,/software-credentials-academy/academy-logout
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.oidcvc.query-param-credential-id=id
