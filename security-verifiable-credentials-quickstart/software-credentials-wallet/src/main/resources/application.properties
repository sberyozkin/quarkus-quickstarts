quarkus.oidc.auth-server-url=${keycloak.host}/realms/software-credentials
quarkus.oidc.client-id=software-credentials-wallet
quarkus.oidc.credentials.secret=uArydomqOymeF0tBrtipkPYujNNUuDlt
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.cookie-path=/software-credentials-wallet
quarkus.oidc.authentication.scopes=profile
quarkus.oidc.token.age=1H
quarkus.oidc.logout.path=/software-credentials-wallet/wallet-logout
